<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiyomizuSuzu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    .dark-mode .card,
    .dark-mode .list-group-item {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-color: #333;
    }

    .dark-mode a {
      color: #90caf9;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
    }

    /* IMPORTANT FIX: isolate Devicon so dark mode doesn't affect it */
    .tech-icon i {
      font-size: 32px;
    }

  </style>
</head>

<body>

  <button id="themeToggle"
          class="btn btn-outline-secondary position-fixed top-0 end-0 m-3 d-flex align-items-center gap-1">

    <span class="material-icons" id="themeIcon">dark_mode</span>
  </button>

  <div class="container py-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card text-center shadow-sm">
          <div class="card-body">

            <img src="Profile.jpg"
                 class="rounded-circle border profile-img mb-3"
                 alt="Profile image">

            <h1 class="card-title">Kiyomizu Suzu</h1>

            <p class="card-text">
              I mainly do Windows automation in PowerShell 7 but sometimes I use C# due to .NET limitations.
            </p>

            <!-- TECH ICONS -->
            <div class="mt-3 d-flex justify-content-center gap-4">

              <div class="text-center tech-icon">
                <i class="devicon-csharp-plain colored"></i>
                <div style="font-size: 12px;">C#</div>
              </div>

              <div class="text-center tech-icon">
                <i class="devicon-powershell-plain colored"></i>
                <div style="font-size: 12px;">PowerShell</div>
              </div>

              <div class="text-center tech-icon">
                <i class="devicon-github-original colored"></i>
                <div style="font-size: 12px;">GitHub</div>
              </div>

            </div>

          </div>
        </div>

        <div class="mt-4">
          <h4>Repositories</h4>

          <ul class="list-group">
            <li class="list-group-item">
              <a href="https://github.com/KiyomizuSuzu/KiyomizuOS" target="_blank">KiyomizuOS</a>
            </li>
            <li class="list-group-item">
              <a href="https://github.com/KiyomizuSuzu/Bluetooth" target="_blank">Bluetooth</a>
            </li>
          </ul>
        </div>

      </div>
    </div>

  </div>

  <script>
    const btn = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");

    function setTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);
      icon.textContent = isDark ? "light_mode" : "dark_mode";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    btn.addEventListener("click", () => {
      setTheme(!document.body.classList.contains("dark-mode"));
    });

    setTheme(localStorage.getItem("theme") === "dark");
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
