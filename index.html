<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container py-5">

    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">

        <!-- Profile Card -->
        <div class="card shadow-sm border-0">
          <div class="card-body text-center p-4">

            <!-- Avatar -->
            <div class="mb-3">
              <div class="rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center mx-auto"
                   style="width:90px;height:90px;font-size:32px;">
                P
              </div>
            </div>

            <h3 class="mb-1">Your Name</h3>
            <p class="text-muted mb-3">Windows Automation Developer</p>

            <p class="mb-4">
              I build Windows automation solutions using PowerShell 7 and C# (.NET).
              Focused on scripting workflows, system tooling, and modern .NET constraints.
            </p>

            <!-- Skills -->
            <div class="mb-3">
              <span class="badge text-bg-primary me-1">PowerShell 7</span>
              <span class="badge text-bg-dark me-1">C#</span>
              <span class="badge text-bg-success me-1">.NET</span>
              <span class="badge text-bg-secondary me-1">Windows Automation</span>
            </div>

            <!-- Links -->
            <div class="d-flex justify-content-center gap-2 mt-3">
              <a href="#" class="btn btn-outline-primary btn-sm">GitHub</a>
              <a href="#" class="btn btn-outline-dark btn-sm">Projects</a>
              <a href="#" class="btn btn-outline-secondary btn-sm">Contact</a>
            </div>

          </div>
        </div>

      </div>
    </div>

  </div>

</body>
</html>
