<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiyomizuSuzu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    body {
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }

    .dark-mode .card,
    .dark-mode .list-group-item {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-color: #333;
    }

    .dark-mode a {
      color: #90caf9;
    }

    .profile-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
    }
  </style>
</head>

<body>

  <button id="themeToggle"
          class="btn btn-outline-secondary position-fixed top-0 end-0 m-3">
    <span class="material-icons" id="themeIcon">dark_mode</span>
  </button>

  <div class="container py-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <!-- Profile Card -->
        <div class="card text-center shadow-sm">
          <div class="card-body">

            <img src="https://via.placeholder.com/120"
                 class="rounded-circle border profile-img mb-3"
                 alt="Profile image">

            <h1 class="card-title">Your Name</h1>

            <p class="card-text">
              Short description about yourself goes here.
            </p>

            <a href="https://github.com/yourusername"
               class="btn btn-dark"
               target="_blank">
              GitHub Profile
            </a>

          </div>
        </div>

        <!-- Repositories -->
        <div class="mt-4">
          <h4>Repositories</h4>

          <ul class="list-group">
            <li class="list-group-item">
              <a href="https://github.com/yourusername/repo1" target="_blank">repo1</a>
            </li>
            <li class="list-group-item">
              <a href="https://github.com/yourusername/repo2" target="_blank">repo2</a>
            </li>
            <li class="list-group-item">
              <a href="https://github.com/yourusername/repo3" target="_blank">repo3</a>
            </li>
          </ul>
        </div>

      </div>
    </div>

  </div>

  <script>
    const btn = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");

    function applyTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);
      icon.textContent = isDark ? "light_mode" : "dark_mode";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    btn.addEventListener("click", () => {
      applyTheme(!document.body.classList.contains("dark-mode"));
    });

    applyTheme(localStorage.getItem("theme") === "dark");
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
