<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KiyomizuSuzu</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
      body.dark-mode {
        background-color: #121212;
        color: #e0e0e0;
      }

      .dark-mode .card,
      .dark-mode .list-group-item {
        background-color: #1e1e1e;
        color: #e0e0e0;
        border-color: #333;
      }

      .dark-mode a {
        color: #90caf9;
      }
    </style>
  </head>

  <body>

  <!-- Theme toggle -->
  <button id="themeToggle" class="btn btn-outline-secondary position-fixed top-0 end-0 m-3">
    <span class="material-icons" id="themeIcon">dark_mode</span>
  </button>

  <div class="container py-5">

    <div class="row justify-content-center">
      <div class="col-md-6">

        <div class="card text-center shadow-sm">
          <div class="card-body">

            <h1 class="card-title">Your Name</h1>
            <p class="card-text">
              Short description about yourself goes here. Example: Web developer focused on frontend and backend systems.
            </p>

            <a href="https://github.com/yourusername" class="btn btn-dark" target="_blank">
              GitHub Profile
            </a>

          </div>
        </div>

        <div class="mt-4">
          <h4>Repositories</h4>

          <ul class="list-group">
            <li class="list-group-item">
              <a href="https://github.com/yourusername/repo1" target="_blank">repo1</a>
            </li>
            <li class="list-group-item">
              <a href="https://github.com/yourusername/repo2" target="_blank">repo2</a>
            </li>
            <li class="list-group-item">
              <a href="https://github.com/yourusername/repo3" target="_blank">repo3</a>
            </li>
          </ul>
        </div>

      </div>
    </div>

  </div>

  <script>
    const toggleBtn = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");

    function setTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);
      icon.textContent = isDark ? "light_mode" : "dark_mode";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    toggleBtn.addEventListener("click", () => {
      setTheme(!document.body.classList.contains("dark-mode"));
    });

    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      setTheme(true);
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
