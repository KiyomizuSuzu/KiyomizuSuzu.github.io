<!DOCTYPE html>
<html data-theme="dark" lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KiyomizuSuzu</title>
  <link rel="icon" href="Profile.avif" type="image/avif">
  <style>
 /* ================================
    DEFAULT
    ================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=block');
    :root {
      --aboveALL: 1;
      --csharp: #239120;
      --javascript: #f7df1e;
      --html: #e34f26;
      --css: #1572b6;
      --rust: #dea584;
      --powershell: #5391fe;
    }
    @keyframes rainbowGlow {
      0%      { box-shadow: 0 0 .5rem hsl(0 100% 60%); }
      16.666% { box-shadow: 0 0 .5rem hsl(60 100% 60%); }
      33.333% { box-shadow: 0 0 .5rem hsl(120 100% 60%); }
      50%     { box-shadow: 0 0 .5rem hsl(180 100% 60%); }
      66.666% { box-shadow: 0 0 .5rem hsl(240 100% 60%); }
      83.333% { box-shadow: 0 0 .5rem hsl(300 100% 60%); }
      100%    { box-shadow: 0 0 .5rem hsl(360 100% 60%); }
    }
    @keyframes loadingIn {
      from {
        opacity: 0;
        transform: translate(-50%, calc(-50% + 0.5rem));
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }
    html {
      font-size: clamp(15px, 0.25vw + 12px, 20px);
    }
    @media (min-width: 1920px) {
      html {
        font-size: 23.5px;
      }
    }
    @media (min-width: 2560px) {
      html {
        font-size: 31.5px;
      }
    }
    @media (min-width: 3840px) {
      html {
        font-size: 50px;
      }
    }
    html[data-theme="light"] {
      --background: white;
      --title: black;
      --description: #555555;
      --box: #f2f2f2;
      --highlight: #ccc;
      --bloom: #333;
      --link: #0366d6;
      --error: #d32f2f;
      --avatar-border: rgba(0, 0, 0, 0.35);
      --warning: #ff8a2a;
      --language-color: 50%;
      --icon: rgba(78, 161, 255, 0.8);
    }
    html[data-theme="dark"] {
      --background: black;
      --title: white;
      --description: #b5b5b5;
      --box: #1a1a1a;
      --highlight: #333;
      --bloom: #ccc;
      --link: #4ea1ff;
      --error: #ff6b6b;
      --avatar-border: rgba(255, 255, 255, 0.14);
      --warning: #ff9d3c;
      --language-color: 25%;
      --icon: rgba(78, 161, 255, 1);
    }
    body {
      display: flex;
      justify-content: center;
      margin-block: 0;
      background-color: var(--background);
      font-family: "Inter", sans-serif;
      color: var(--title);
    }
    body,
    .theme-button,
    .translate-button,
    .translate-menu,
    .translate-menu button,
    .description,
    .profile img,
    .repo-name a,
    .repo-desc,
    .repo-time,
    .notice,
    .notice-details,
    .repo-badge {
      transition: background-color .15s,
                  color .15s,
                  border-color .15s;
    }
    body.loadingBarrier {
      display: flex;
      align-items: center;
    }
    #loadingAssets {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: var(--aboveALL);
      padding: 1rem 1.5rem;
      background-color: rgba(40, 55, 95, 0.60);
      border-radius: 0.375rem;
      font-family: sans-serif;
      font-weight: 600;
      font-size: 1rem;
      white-space: nowrap;
      animation: loadingIn .5s forwards;
    }
    #loadingAssets::after {
      content: "";
      display: inline-block;
      width: 1.2rem;
      animation: dots .5s steps(4, end) infinite;
    }
    body.loadingBarrier .container {
      filter: blur(0.375rem);
      pointer-events: none;
      user-select: none;
    }
    .image-preview {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity .15s, visibility .15s;
      z-index: var(--aboveALL);
    }
    .image-preview img {
      width: min(80vw, 35rem);
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      transform: scale(.4);
      transition: transform .15s;
    }
    .image-preview.show {
      opacity: 1;
      visibility: visible;
    }
    .image-preview.show img {
      transform: scale(1);
    }
    .message {
      position: fixed;
      top: 0;
      left: 0;
      color: var(--error);
      font-size: 2rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      z-index: var(--aboveALL);
      transition: opacity .15s;
      white-space: nowrap;
    }
    .message.show {
      opacity: 0.85;
    }
 /* ================================
    Container for Top and Bottom
    ================================ */
    .container {
      display: flex;
      flex-direction: column;
      max-width: 34.4rem;
      min-height: 100dvh;
      transition: filter .5s;
    }
 /* ================================
    Top container
    ================================ */
    .top {
      display: flex;
      position: relative;
      justify-content: center;
    }
    .theme-button, .translate-button {
      display: flex;
      padding: 0.5rem;
      background-color: var(--box);
      border: 0.0625rem solid var(--highlight);
      border-radius: 0.5rem;
    }
    .theme-button, .translate-button, .translate-menu button {
      cursor: pointer;
      color: var(--title);
    }
    .theme-button, .translate-dropdown {
      position: absolute;
      top: 0.625rem;
    }
    .theme-button { 
      right: 0.625rem; 
    }
    .translate-dropdown { 
      left: 0.625rem; 
    }
    .theme-button:hover, .translate-button:hover {
      background-color: var(--highlight);
      border-color: var(--title);
      transform: scale(1.05);
    }
    .translate-menu button:hover, .translate-menu button:focus {
      background-color: var(--highlight);
    }
    .translate-menu button[data-active] {
      background-color: color-mix(in srgb, var(--link) 15%, transparent);
      color: var(--link);
      font-weight: 600;
    }
    .theme-button svg, .translate-button svg {
      width: 1.375rem;
      height: 1.375rem;
    }
    .translate-menu {
      position: absolute;
      top: calc(100% + 0.375rem);
      left: 0;
      margin-block: 0;
      padding: 0.375rem;
      width: 5rem;
      list-style: none;
      background-color: var(--box);
      border: 0.0625rem solid var(--highlight);
      border-radius: 0.5rem;
      box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.15);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-0.25rem);
      transition: background-color .15s, border-color .15s,
                  opacity .15s, transform .15s, visibility .15s;
    }
    .translate-dropdown.open .translate-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity .15s, transform .15s;
    }
    .translate-dropdown:not(.open) .translate-menu button {
      cursor: default;
    }
    .translate-menu button {
      padding: 0.375rem 0.625rem;
      background-color: transparent;
      border: none;
      border-radius: 0.375rem;
      font-size: 1rem;
      width: 100%;
    }
    html[data-theme="dark"] .icon-sun {
      display: none;
    }
    html[data-theme="light"] .icon-moon {
      display: none;
    }
    .profile {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .profile img {
      margin-top: 0.625rem;
      width: 7.5rem;
      height: 7.5rem;
      border-radius: 50%;
      object-fit: cover;
      border: 0.25rem solid var(--avatar-border);
      cursor: zoom-in;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      animation: rainbowGlow 5s linear infinite;
    }
    .profile img:not(.open):hover {
      transform: scale(1.06);
    }
    .profile img.open {
      cursor: default;
      transform: scale(1.06);
    }
    .name {
      margin-block: 0;
      line-height: 1.5;
    }
    .description {
      text-align: center;
      margin-block: 0;
      margin-bottom: 0.0625rem;
      color: var(--description);
      font-style: italic;
      font-weight: 500;
      width: 90%;
    }
    html[lang="ja"] .description {
      font-weight: 600;
    }
    .icons div {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 0.75rem;
      flex-wrap: wrap;
    }
    .icons > div:first-child {
      transform: translateX(-1rem);
    }
    .icons > div:last-child {
      transform: translateX(1rem);
    }
    .icons svg {
      width: 4rem;
      height: 4rem;
      transition: transform .15s , filter .15s;
    }
    .icons a {
      transition: transform .15s;
    }
    .icons a:hover {
      transform: translateY(-0.1875rem);
    }
    .icons a:hover svg {
  transform: scale(1.1);
  filter: drop-shadow(0 0 0.75rem var(--icon));
}
 /* ================================
    Bottom container
    ================================ */
    .bottom {
      display: flex;
      flex-direction: column;
    }
    .repo-header {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.375rem;
      margin-top: 0.75rem;
      margin-bottom: 0.25rem;
    }
    .repo-header svg {
      display: flex;
      width: 1.75rem;
      height: 1.75rem;
      border: 0.0625rem solid #fff;
      border-radius: 50%;
      transition: transform .15s , filter .15s;
    }
    .repo-header p {
      margin-block: 0;
      font-weight: 500;
      text-decoration: underline;
      text-decoration-color: var(--warning);
      text-decoration-thickness: 0.125rem;
      text-underline-offset: 0.15rem;
    }
    .repo-title {
      margin-block: 0;
      white-space: nowrap;
    }
    .repo-header a:hover svg{
      transform: scale(1.1);
      filter: drop-shadow(0 0 0.75rem rgba(78, 161, 255, 0.4));
    }
    .repo-list .repo-div {
      padding: 0.625rem;
      border: 0.125rem solid var(--highlight);
      border-radius: 0.375rem;
      background-color: var(--box);
      transition: background-color .15s, border-color .15s, transform .15s;
    }
    .repo-list .repo-div:hover {
      transform: translateY(-0.125rem);
      border-color: var(--title);
      box-shadow: 0 0.25rem 0.75rem var(--box);
    }
    .repo-name {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      margin-block: 0;
      font-size: 1rem;
    }
    .repo-name a {
      text-decoration: none;
      color: var(--link);
    }
    .repo-name a:hover {
      text-decoration: underline;
    }
    .repo-time {
      display: flex;
      align-items: center;
      line-height: 1;
      gap: 0.25rem;
      font-size: 0.75rem;
      padding: 0.125rem 0.375rem;
      border-radius: 50rem;
      background-color: var(--highlight);
      color: var(--description);
    }
    .repo-time svg {
      width: 0.875rem;
      height: 0.875rem;
    }
    .repo-desc {
      margin-block: 0;
      margin-top: 0.3125rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--description);
      line-height: 1.5;
    }
    .repo-languages {
      display: flex;
      gap: 0.35rem;
      margin-top: 0.5rem;
    }
    .repo-badge {
      padding: 0.15rem 0.55rem;
      border-radius: 0.5rem;
      background-color: color-mix(in srgb, var(--language) var(--language-color), var(--box));
      color: var(--bloom);
      font-size: 0.75rem;
      font-weight: 700;
    }
    .repo-badge.csharp     { --language: var(--csharp); }
    .repo-badge.javascript { --language: var(--javascript); }
    .repo-badge.html       { --language: var(--html); }
    .repo-badge.css        { --language: var(--css); }
    .repo-badge.rust       { --language: var(--rust); }
    .repo-badge.powershell { --language: var(--powershell); }
    .notice {
      padding: 1rem;
      border-radius: 0.375rem;
      border: 0.0625rem solid var(--highlight);
      background-color: var(--box);
      text-align: center;
      color: var(--error);
    }
    .notice-message {
      margin-block: 0;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }
    .notice-details {
      margin-block: 0;
      color: var(--error);
      font-weight: 600;
      line-height: 1.5;
    }
  </style>
</head>

<script type="module">
  // @ts-ignore
  import {createClient} from "https://esm.sh/@supabase/supabase-js@2";
  const supabaseUrl = "https://iardacsuwzgfjsdefqdj.supabase.co";
  const supabaseKey = "sb_publishable_aqniMrzHTzhEWxbSpBopeA_4SyoQ8mJ";
  const supabaseClient = createClient(supabaseUrl, supabaseKey);
  /**
  * @typedef {{
  *   Link: string;
  *   Name: string;
  *   Details: string | null;
  *   Details_ja: string | null;
  *   EstimatedTime: number | null;
  * }} Repo
  *
  * @typedef {HTMLElement} DropdownElement
  * @typedef {HTMLButtonElement} DropdownButton
  * @typedef {NodeListOf<HTMLButtonElement>} DropdownButtons
  */
  /** @type {Repo[]} */
  let cachedRepos = [];
  /** @param {Repo[]} repos */
  function renderRepositories(repos) {
    if (repos.length === 0) {
      return;
    }
    else {
      const lang = document.documentElement.lang;
      const repoList = document.getElementById("repoList");
      repoList.innerHTML = repos.map(repo => {
        const details = (lang === 'ja' && repo.Details_ja) ? repo.Details_ja : repo.Details;
        const unit = lang === 'ja' ? '時間' : (repo.EstimatedTime === 1 ? 'Hour' : 'Hours');
        return `
          <div class="repo-div">
            <h3 class="repo-name">
              <a href="${repo.Link}" target="_blank">${repo.Name}</a>
              <span class="repo-time">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <path d="M12 6v6l4 2"></path>
                </svg>${repo.EstimatedTime} ${unit}
              </span>
            </h3>
            <p class="repo-desc">${details ?? ""}</p>
            <div class="repo-languages">
              ${(repo.Languages ?? []).map(language => {
                const ClassName =
                  language === "C#" ? "csharp" :
                  language.toLowerCase().replace(/[ +.#]/g, "-");
                return `
                  <span class="repo-badge ${ClassName}">
                    ${language}
                  </span>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");
    }
  }
  async function loadRepositories() {
    const {data, error} = await supabaseClient.from("Repositories").select("*").order("DisplayOrder");
    if (error) {
      console.error(error);
      return;
    }
    else {
      cachedRepos = data ?? [];
      renderRepositories(cachedRepos);
    }
  }
  document.querySelector(".theme-button")?.addEventListener("click", () => {
    const html = document.documentElement;
    html.dataset.theme = html.dataset.theme === "dark" ? "light" : "dark";
  });
  window.addEventListener("load", async () => {
    const loading = document.getElementById("loadingAssets");
    await document.fonts.ready;
    document.querySelectorAll('[data-en][data-ja]').forEach(translatable => {
      const English = /** @type {HTMLElement} */ (translatable);
      English.textContent = English.dataset.en;
    });
    loading.textContent = "Fetching repositories";
    await loadRepositories();
    loading.style.opacity = "0";
    setTimeout(() => {
      document.body.classList.remove("loadingBarrier");
      loading.remove();
    }, 500);
  });
  document.addEventListener('DOMContentLoaded', () => {
    /** @type {DropdownElement} */
    const dropdown = (document.querySelector('.translate-dropdown'));
    /** @type {DropdownButton} */
    const toggleBtn = (dropdown.querySelector('.translate-button'));
    /** @type {DropdownButtons} */
    const menuButtons = (dropdown.querySelectorAll('.translate-menu button'));
    toggleBtn.addEventListener('click', (mouseClicked) => {
      mouseClicked.stopPropagation();
      const isOpen = dropdown.classList.toggle('open');
    });
    document.addEventListener('click', () => {
      dropdown.classList.remove('open');
    });
    menuButtons.forEach((button) => {
      button.addEventListener('click', () => {
        const lang = button.dataset.lang;
        setLanguage(lang);
        dropdown.classList.remove('open');
      });
    });
    /** @param {string} lang */
    function setLanguage(lang) {
      document.documentElement.lang = lang;
      menuButtons.forEach(button => {
        button.toggleAttribute('data-active', button.dataset.lang === lang);
      });
      document.querySelectorAll('[data-en][data-ja]').forEach(translatable => {
        const Selected = /** @type {HTMLElement} */ (translatable);
        Selected.textContent = Selected.dataset[lang];
      });
      renderRepositories(cachedRepos);
    }
  });
  const avatar = document.querySelector(".profile img");
  const modal = document.getElementById("imagePreview");
  function openPreview() {
    modal.classList.add("show");
    requestAnimationFrame(() => {
      avatar.classList.add("open");
    });
    document.body.style.overflow = "hidden";
  }
  function closePreview() {
    modal.classList.remove("show");
    avatar.classList.remove("open");
    document.body.style.overflow = "";
  }
  if (/Mobi|Android|iPad/i.test(navigator.userAgent)) {
    modal.style.visibility = "hidden";
    openPreview();
    setTimeout(() => {
      closePreview();
      modal.style.visibility = "";
    }, 150);
  }
  avatar.addEventListener("click", openPreview);
  modal.addEventListener("click", closePreview);
</script>
</html>
