<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layout</title>
  <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --muted: #555555;
      --card: #f2f2f2;
      --border: #ccc;
      --link: #0366d6;
    }
    body {
      background: var(--bg);
      color: var(--text);
    }
    .dark-mode {
      --bg: #0f0f0f;
      --text: #eaeaea;
      --muted: #b5b5b5;
      --card: #1a1a1a;
      --border: #333;
      --link: #4ea1ff;
    }
 /* ================================
    Container for Top and Bottom
    ================================ */
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 500px;
      margin: 0 auto;
      max-width: 100%;
    }
 /* ================================
    Top container
    ================================ */
    .top {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .profile {
      text-align: center;
      max-width: 400px;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
    }
    .name {
      margin: 10px 0 5px;
    }
    .description {
      margin: 0 0 15px;
      color: var(--muted);
    }
    .icons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .icons {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-top: 12px;
    }
    .icons svg {
      width: 64px;
      height: 64px;
    }
    .icons i {
      font-size: 64px;
    }
 /* ================================
    Bottom container
    ================================ */
    .bottom {
      padding: 20px;
    }
    .repo-title {
      margin-bottom: 15px;
    }
    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .repo {
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card);
    }
    .repo-name {
      margin: 0;
      font-size: 16px;
    }
    .repo-name a {
      text-decoration: none;
      color: var(--link);
    }
    .repo-name a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <button onclick="toggleTheme()" style="position:fixed;top:10px;right:10px;">
  Toggle Theme
  </button>
<div class="container">

      </svg>
      <i class="devicon-github-original"></i>
    </div>
    </div>
  </div>
  <div class="bottom">
    <h2 class="repo-title">Repositories</h2>
    <div class="repo-list">
      <div class="repo">
        <h3 class="repo-name">
          <a href="https://github.com/KiyomizuSuzu/KiyomizuOS" target="_blank">
            KiyomizuOS
          </a>
        </h3>
      </div>
      <div class="repo">
        <h3 class="repo-name">
          <a href="https://github.com/KiyomizuSuzu/Bluetooth" target="_blank">
            Bluetooth
          </a>
        </h3>
      </div>
    </div>
  </div>
</div>
</body>
<script>
function toggleTheme() {
  document.body.classList.toggle("dark-mode");
}
</script>
</html>
