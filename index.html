<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KiyomizuSuzu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body {
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    body.dark-mode {
      background-color: #121212;
      color: #e0e0e0;
    }
    .dark-mode .card,
    .dark-mode .list-group-item {
      background-color: #1e1e1e;
      color: #e0e0e0;
      border-color: #333;
    }
    .dark-mode a {
      color: #90caf9;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <button id="themeToggle"
          class="btn btn-outline-secondary position-fixed top-0 end-0 m-3">
    <span class="material-icons" id="themeIcon">dark_mode</span>
  </button>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card text-center shadow-sm">
          <div class="card-body">
            <img src="Profile.jpg"
                 class="rounded-circle border profile-img mb-3"
                 alt="Profile image">
            <h1 class="card-title">Kiyomizu Suzu</h1>
            <p class="card-text">
              I mainly do Windows automation in PowerShell 7 but sometimes I will use C# because of modern .NET limitations.
            </p>
            <div class="mt-3 d-flex justify-content-center gap-4">

              <!-- C# -->
              <div class="text-center">
                <svg width="28" height="28" viewBox="0 0 128 128" fill="currentColor">
                  <path d="M64 0l55.4 32v64L64 128 8.6 96V32zM64 12.3L20.3 37.2v53.6L64 115.7l43.7-24.9V37.2z"/>
                  <text x="64" y="78" text-anchor="middle" font-size="40" fill="white">C#</text>
                </svg>
                <div style="font-size: 12px;">C#</div>
              </div>

              <!-- PowerShell -->
              <div class="text-center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3 4h18v16H3V4zm2 2v12h14V6H5zm2 2h2v2H7V8zm0 4h6v2H7v-2z"/>
                </svg>
                <div style="font-size: 12px;">PowerShell</div>
              </div>

              <!-- GitHub -->
              <div class="text-center">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 .5C5.7.5.6 5.7.6 12.1c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.3.8-.6v-2.2c-3.2.7-3.9-1.4-3.9-1.4-.5-1.3-1.2-1.6-1.2-1.6-1-.7.1-.7.1-.7 1.1.1 1.7 1.1 1.7 1.1 1 .1.7 2.5 3.5 1.7.1-.7.4-1.2.8-1.5-2.6-.3-5.3-1.3-5.3-5.9 0-1.3.5-2.4 1.2-3.2-.1-.3-.5-1.5.1-3.1 0 0 1-.3 3.3 1.2.9-.2 1.8-.3 2.7-.3s1.8.1 2.7.3c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.1.8.8 1.2 1.9 1.2 3.2 0 4.6-2.7 5.6-5.3 5.9.4.4.8 1.1.8 2.3v3.4c0 .3.2.7.8.6 4.6-1.5 7.9-5.8 7.9-10.9C23.4 5.7 18.3.5 12 .5z"/>
                </svg>
                <div style="font-size: 12px;">GitHub</div>
              </div>

            </div>
          </div>
        </div>
        <div class="mt-4">
          <h4>Repositories</h4>
          <ul class="list-group">
            <li class="list-group-item">
              <a href="https://github.com/KiyomizuSuzu/KiyomizuOS" target="_blank">KiyomizuOS</a>
            </li>
            <li class="list-group-item">
              <a href="https://github.com/KiyomizuSuzu/Bluetooth" target="_blank">Bluetooth</a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
  <script>
    const btn = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");
    function applyTheme(isDark) {
      document.body.classList.toggle("dark-mode", isDark);
      icon.textContent = isDark ? "light_mode" : "dark_mode";
      localStorage.setItem("theme", isDark ? "dark" : "light");
    }
    btn.addEventListener("click", () => {
      applyTheme(!document.body.classList.contains("dark-mode"));
    });
    applyTheme(localStorage.getItem("theme") === "dark");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
